name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to publish the current package version to PyPI
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Confirm explicit publish intent
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "PUBLISH" || {
            echo "Refusing to publish: confirm must equal PUBLISH" >&2
            exit 1
          }

      - name: Install build and validation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine -e ".[mcp]"

      - name: Run release checks
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
          osi-validate-plugin --root .

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions-${{ github.run_id }}
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
