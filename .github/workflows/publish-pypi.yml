name: publish-pypi

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    if: github.event.release.published_at != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build and validation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine

      - name: Run release checks
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
          osi-validate-plugin --root .

      - name: Download and verify exact GitHub Release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(PYTHONPATH=src python -c 'import aiworkstation_osi; print(aiworkstation_osi.__version__)')"
          test "v$version" = "${{ github.event.release.tag_name }}"
          mkdir -p tmp/release-assets
          gh release download "${{ github.event.release.tag_name }}" --dir tmp/release-assets \
            --pattern "aiworkstation_open_source_intelligence-${version}*" \
            --pattern PYTHON-DISTS-SHA256SUMS
          test -f tmp/release-assets/PYTHON-DISTS-SHA256SUMS
          (cd tmp/release-assets && sha256sum --check PYTHON-DISTS-SHA256SUMS)
          mkdir -p dist
          cp tmp/release-assets/*.whl tmp/release-assets/*.tar.gz dist/

      - name: Validate distributions
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions-${{ github.run_id }}
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
