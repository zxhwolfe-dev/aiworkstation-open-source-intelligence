name: github-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.3.0
        required: true
        type: string
      commit:
        description: Full commit SHA to release
        required: true
        type: string
      prerelease:
        description: Mark this release as a pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate tag format and package version
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "commit must be a full 40-character SHA" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$COMMIT^{commit}")" || {
            echo "checkout did not resolve to requested commit" >&2
            exit 1
          }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag must look like v0.3.0" >&2
            exit 1
          }
          PYTHONPATH=src python - <<'PY'
          import json, os
          import aiworkstation_osi
          from pathlib import Path
          tag = os.environ["TAG"]
          plugin = json.loads(Path(".codex-plugin/plugin.json").read_text(encoding="utf-8"))
          version = str(plugin["version"])
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match plugin version {version}")
          if aiworkstation_osi.__version__ != version:
              raise SystemExit("runtime version does not match plugin version")
          PY

      - name: Install and run release gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install build -e ".[mcp]"
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
          osi-validate-plugin --root .

      - name: Build deterministic Skills bundle
        run: |
          osi-build-alpha --root . --output-dir dist/alpha
          (cd dist/alpha && sha256sum --check SHA256SUMS)

      - name: Build Python release artifacts
        run: |
          python -m build --outdir dist/python
          (cd dist/python && sha256sum *.whl *.tar.gz > PYTHON-DISTS-SHA256SUMS)

      - name: Create GitHub pre-release/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag="--prerelease"
          fi
          archive="$(python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('dist/alpha/bundle-report.json').read_text())
          print(report['archive'])
          PY
          )"
          release_commit="$(git rev-parse HEAD)"
          gh release create "$TAG" \
            --target "$release_commit" \
            $prerelease_flag \
            --title "$TAG — AI Open Source Intelligence" \
            --notes-file CHANGELOG.md \
            "$archive" \
            dist/alpha/SHA256SUMS \
            dist/alpha/bundle-report.json \
            dist/python/*.whl \
            dist/python/*.tar.gz \
            dist/python/PYTHON-DISTS-SHA256SUMS
