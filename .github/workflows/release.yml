            tag_status="$(printf '%s\n' "$tag_response" | awk 'toupper($1) ~ /^HTTP/ {code=$2} END {print code}')"
            case "$tag_status" in
              404) ;;
              200|201) echo "tag ref exists before promotion" >&2; exit 1 ;;
              *) cat /tmp/tag-error >&2; echo "cannot establish that tag ref is absent" >&2; exit 1 ;;
            esac
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" -f draft=false -F prerelease="$PRERELEASE" >/tmp/final-release-after.json
          else
            cp /tmp/final-release-before.json /tmp/final-release-after.json
          fi
          RELEASE_JSON=/tmp/final-release-after.json TAG="$TAG" COMMIT="$COMMIT" PRERELEASE="$PRERELEASE" RELEASE_ID="$RELEASE_ID" PYTHONPATH=src python - "${expected[@]}" <<'PY'
          import json, os, sys
          from aiworkstation_osi.release_promotion import validate_release
          payload=json.load(open(os.environ['RELEASE_JSON']))
          validate_release(payload, tag=os.environ['TAG'], commit=os.environ['COMMIT'], expected_assets=sys.argv[1:], release_id=int(os.environ['RELEASE_ID']), draft=False, prerelease=os.environ['PRERELEASE']=='true')
          if payload.get('draft') is not False: raise SystemExit('release remained Draft after promotion')
          PY
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG")"
          tag_type="$(jq -r '.object.type' <<<"$tag_json")"
          tag_object="$(jq -r '.object.sha' <<<"$tag_json")"
          if [ "$tag_type" = tag ]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$tag_object" --jq '.object.sha')"
          else
            tag_sha="$tag_object"
          fi
          test "$tag_sha" = "$COMMIT" || { echo "published tag ref does not resolve to input commit" >&2; exit 1; }
          names="$(jq -r '.assets[].name' /tmp/final-release-after.json | sort)"
          expected_text="$(printf '%s\n' "${expected[@]}" | sort)"
          test "$names" = "$expected_text"
          echo "PyPI verified ${{ needs.pypi-publish-and-verify.outputs.wheel_name }}=${{ needs.pypi-publish-and-verify.outputs.wheel_sha }}"
          echo "PyPI verified ${{ needs.pypi-publish-and-verify.outputs.sdist_name }}=${{ needs.pypi-publish-and-verify.outputs.sdist_sha }}"
          echo "GHCR verified RepoDigest=${{ needs.ghcr-publish-and-verify.outputs.digest }}"
