name: github-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.3.0
        required: true
        type: string
      commit:
        description: Full commit SHA to release
        required: true
        type: string
      prerelease:
        description: Mark this release as a pre-release
        required: true
        default: true
        type: boolean

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  build-and-stage-draft:
    name: Build and stage Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.identity.outputs.version }}
      wheel_name: ${{ steps.identity.outputs.wheel_name }}
      sdist_name: ${{ steps.identity.outputs.sdist_name }}
      archive_name: ${{ steps.draft.outputs.archive_name }}
      release_id: ${{ steps.draft.outputs.release_id }}
      release_state: ${{ steps.draft.outputs.release_state }}
      asset_ids: ${{ steps.draft.outputs.asset_ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install workflow CLI dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: Validate release identity and package version
        id: identity
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo "workflow must be dispatched from main" >&2; exit 1; }
          test "$COMMIT" = "$GITHUB_SHA" || { echo "input commit must equal immutable workflow SHA" >&2; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "commit must be a full 40-character SHA" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$COMMIT^{commit}")" || { echo "checkout did not resolve to requested commit" >&2; exit 1; }
          [[ "$PRERELEASE" == true || "$PRERELEASE" == false ]] || { echo "prerelease input is invalid" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v0.3.0" >&2; exit 1; }
          version="$(PYTHONPATH=src python -c 'import aiworkstation_osi; print(aiworkstation_osi.__version__)')"
          plugin_version="$(python -c 'import json; from pathlib import Path; print(json.loads(Path(".codex-plugin/plugin.json").read_text(encoding="utf-8"))["version"])')"
          test "$TAG" = "v$version" || { echo "tag does not match runtime version" >&2; exit 1; }
          test "$version" = "$plugin_version" || { echo "runtime does not match plugin version" >&2; exit 1; }
          wheel_name="aiworkstation_open_source_intelligence-${version}-py3-none-any.whl"
          sdist_name="aiworkstation_open_source_intelligence-${version}.tar.gz"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wheel_name=$wheel_name" >> "$GITHUB_OUTPUT"
          echo "sdist_name=$sdist_name" >> "$GITHUB_OUTPUT"

      - name: Install and run release gates
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build twine ruff -e ".[mcp]"
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
          osi-validate-plugin --root .
          ruff check src

      - name: Build deterministic Skills bundle
        run: |
          set -euo pipefail
          rm -rf dist
          osi-build-alpha --root . --output-dir dist/alpha
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from aiworkstation_osi.release_promotion import validate_bundle_report, verify_checksum_manifest
          root=Path('dist/alpha'); archive=Path(__import__('json').loads((root/'bundle-report.json').read_text())['archive']).name
          verify_checksum_manifest((root/'SHA256SUMS').read_text(), [archive], {archive: (root/archive).read_bytes()})
          validate_bundle_report((root/'bundle-report.json').read_bytes(), expected_name='aiworkstation-open-source-intelligence', expected_version='${{ steps.identity.outputs.version }}', expected_archive_name=archive, archive_bytes=(root/archive).read_bytes())
          PY
          (cd dist/alpha && sha256sum --check SHA256SUMS)
          osi-build-alpha --root . --output-dir dist/alpha-second
          test "$(sha256sum dist/alpha/*.zip | cut -d' ' -f1)" = "$(sha256sum dist/alpha-second/*.zip | cut -d' ' -f1)"

      - name: Build exact Python release artifacts
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          WHEEL_NAME: ${{ steps.identity.outputs.wheel_name }}
          SDIST_NAME: ${{ steps.identity.outputs.sdist_name }}
        run: |
          set -euo pipefail
          python -m build --outdir dist/python
          mapfile -t wheels < <(find dist/python -maxdepth 1 -type f -name '*.whl' -printf '%f\n' | sort)
          mapfile -t sdists < <(find dist/python -maxdepth 1 -type f -name '*.tar.gz' -printf '%f\n' | sort)
          test "${#wheels[@]}" -eq 1 && test "${wheels[0]}" = "$WHEEL_NAME"
          test "${#sdists[@]}" -eq 1 && test "${sdists[0]}" = "$SDIST_NAME"
          test -f "dist/python/$WHEEL_NAME" && test -f "dist/python/$SDIST_NAME"
          (cd dist/python && sha256sum "$WHEEL_NAME" "$SDIST_NAME" > PYTHON-DISTS-SHA256SUMS)
          PYTHONPATH=src VERSION="$VERSION" WHEEL_NAME="$WHEEL_NAME" SDIST_NAME="$SDIST_NAME" python - <<'PY'
          import os
          from pathlib import Path
          from aiworkstation_osi.release_promotion import validate_sdist_metadata, validate_wheel_metadata, verify_checksum_manifest
          root=Path('dist/python'); wheel=os.environ['WHEEL_NAME']; sdist=os.environ['SDIST_NAME']
          verify_checksum_manifest((root/'PYTHON-DISTS-SHA256SUMS').read_text(), [wheel, sdist], {wheel: (root/wheel).read_bytes(), sdist: (root/sdist).read_bytes()})
          validate_wheel_metadata((root/wheel).read_bytes(), 'aiworkstation-open-source-intelligence', os.environ['VERSION'])
          validate_sdist_metadata((root/sdist).read_bytes(), 'aiworkstation-open-source-intelligence', os.environ['VERSION'])
          PY
          python -m twine check "dist/python/$WHEEL_NAME" "dist/python/$SDIST_NAME"

      - name: Create or safely resume matching Draft Release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          PRERELEASE: ${{ inputs.prerelease }}
          WHEEL_NAME: ${{ steps.identity.outputs.wheel_name }}
          SDIST_NAME: ${{ steps.identity.outputs.sdist_name }}
        run: |
          set -euo pipefail
          retry_gh_api_to_file() {
            local output="$1"
            local label="$2"
            shift 2
            local attempt
            for attempt in 1 2 3 4 5; do
              if gh api "$@" > "$output"; then
                return 0
              fi
              rm -f "$output"
              if [ "$attempt" -eq 5 ]; then
                echo "$label did not become readable after bounded retries" >&2
                return 1
              fi
              sleep 2
            done
          }
          archive_path="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("dist/alpha/bundle-report.json").read_text())["archive"])')"
          archive_name="$(basename "$archive_path")"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          expected=("$archive_name" SHA256SUMS bundle-report.json "$WHEEL_NAME" "$SDIST_NAME" PYTHON-DISTS-SHA256SUMS)
          mkdir -p tmp
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > tmp/releases.json
          python - "$TAG" "$COMMIT" "${expected[@]}" <<'PY' > tmp/release-id-state
          import json, sys
          from aiworkstation_osi.release_promotion import flatten_releases, locate_draft, locate_release
          releases=flatten_releases(json.load(open('tmp/releases.json')))
          has_draft=any(item.get('tag_name') == sys.argv[1] and item.get('draft') is True for item in releases)
          identity=(locate_draft if has_draft else locate_release)(releases, tag=sys.argv[1], commit=sys.argv[2], expected_assets=sys.argv[3:])
          print(f"{identity.release_id}\t{'draft' if identity.draft else 'public'}" if identity else '')
          PY
          release_record="$(cat tmp/release-id-state)"
          if [ -z "$release_record" ]; then
            git fetch origin main --no-tags --depth=1
            test "$COMMIT" = "$(git rev-parse FETCH_HEAD)" || { echo "new Draft creation requires current origin/main" >&2; exit 1; }
            tag_response="$(gh api --include "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" 2>/tmp/tag-error || true)"
            tag_status="$(printf '%s\n' "$tag_response" | awk 'toupper($1) ~ /^HTTP/ {code=$2} END {print code}')"
            case "$tag_status" in
              404) ;;
              200|201) echo "tag exists without matching Draft Release" >&2; exit 1 ;;
              *) cat /tmp/tag-error >&2; echo "cannot establish that tag ref is absent" >&2; exit 1 ;;
            esac
            gh release create "$TAG" --draft --target "$COMMIT" \
              --title "$TAG — AI Open Source Intelligence" --notes-file CHANGELOG.md \
              "dist/alpha/$archive_name" dist/alpha/SHA256SUMS dist/alpha/bundle-report.json \
              "dist/python/$WHEEL_NAME" "dist/python/$SDIST_NAME" dist/python/PYTHON-DISTS-SHA256SUMS
            for attempt in 1 2 3 4 5; do
              if gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > tmp/releases-after-create.json; then
                python - "$TAG" "$COMMIT" "${expected[@]}" <<'PY' > tmp/release-id-state
          import json, sys
          from aiworkstation_osi.release_promotion import flatten_releases, locate_draft
          identity=locate_draft(flatten_releases(json.load(open('tmp/releases-after-create.json'))), tag=sys.argv[1], commit=sys.argv[2], expected_assets=sys.argv[3:])
          if identity is not None:
              print(f"{identity.release_id}\t{'draft' if identity.draft else 'public'}")
          PY
              else
                rm -f tmp/releases-after-create.json tmp/release-id-state
              fi
              if [ -s tmp/release-id-state ]; then break; fi
              if [ "$attempt" -eq 5 ]; then
                echo "created Draft Release did not become visible after bounded retries" >&2
                exit 1
              fi
              sleep 2
            done
            release_record="$(cat tmp/release-id-state)"
          fi
          release_id="${release_record%%$'\t'*}"
          discovered_state="${release_record#*$'\t'}"
          test -n "$release_id" && { test "$discovered_state" = draft || test "$discovered_state" = public; }
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          retry_gh_api_to_file tmp/draft.json "Draft Release details" "repos/${GITHUB_REPOSITORY}/releases/$release_id"
          RELEASE_JSON=tmp/draft.json TAG="$TAG" COMMIT="$COMMIT" RELEASE_ID="$release_id" python - "${expected[@]}" <<'PY' > tmp/release-state
          import json, os, sys
          from aiworkstation_osi.release_promotion import merge_release_states, validate_release
          identity=validate_release(json.load(open(os.environ['RELEASE_JSON'])), tag=os.environ['TAG'], commit=os.environ['COMMIT'], expected_assets=sys.argv[1:], release_id=int(os.environ['RELEASE_ID']))
          print('draft' if identity.draft else 'public')
          PY
          release_state="$(cat tmp/release-state)"
          echo "release_state=$release_state" >> "$GITHUB_OUTPUT"
          asset_ids="$(jq -c '(.assets // []) | map({key: .name, value: .id}) | from_entries' tmp/draft.json)"
          test "$asset_ids" != '{}' || { echo "Draft Release has no assets" >&2; exit 1; }
          echo "asset_ids=$asset_ids" >> "$GITHUB_OUTPUT"
          if [ "$release_state" = public ]; then
            echo "a published Release already exists; final promotion will verify and resume it" >&2
          fi
          test "$(jq -r '.target_commitish' tmp/draft.json)" = "$COMMIT"
          rm -rf tmp/staged-assets && mkdir -p tmp/staged-assets
          jq -r '.assets[] | [.name, .id] | @tsv' tmp/draft.json | while IFS=$'\t' read -r name asset_id; do
            retry_gh_api_to_file "tmp/staged-assets/$name" "Draft Release asset $name" \
              -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id"
          done
          PYTHONPATH=src python - "$archive_name" "$WHEEL_NAME" "$SDIST_NAME" <<'PY'
          import sys
          from aiworkstation_osi.release_promotion import validate_bundle_report, verify_checksum_manifest
          root='tmp/staged-assets'; archive, wheel, sdist=sys.argv[1:]
          files={name: open(f'{root}/{name}','rb').read() for name in (archive, wheel, sdist)}
          verify_checksum_manifest(open(f'{root}/SHA256SUMS').read(), [archive], {archive: files[archive]})
          verify_checksum_manifest(open(f'{root}/PYTHON-DISTS-SHA256SUMS').read(), [wheel, sdist], {wheel: files[wheel], sdist: files[sdist]})
          validate_bundle_report(open(f'{root}/bundle-report.json','rb').read(), expected_name='aiworkstation-open-source-intelligence', expected_version='${{ steps.identity.outputs.version }}', expected_archive_name=archive, archive_bytes=files[archive])
          PY
          (cd tmp/staged-assets && sha256sum --check SHA256SUMS && sha256sum --check PYTHON-DISTS-SHA256SUMS)
          cmp -s "dist/alpha/$archive_name" "tmp/staged-assets/$archive_name" || { echo "Draft Skills archive differs from deterministic build" >&2; exit 1; }
          if [ "$release_state" = draft ]; then
            tag_response="$(gh api --include "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" 2>/tmp/tag-error || true)"
            tag_status="$(printf '%s\n' "$tag_response" | awk 'toupper($1) ~ /^HTTP/ {code=$2} END {print code}')"
            case "$tag_status" in
              404) ;;
              200|201) echo "tag ref exists before Draft promotion; refusing to continue" >&2; exit 1 ;;
              *) cat /tmp/tag-error >&2; echo "cannot establish that tag ref is absent" >&2; exit 1 ;;
            esac
            tag_commit=""
          else
            test "$(jq -r '.prerelease' tmp/draft.json)" = "$PRERELEASE"
            tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG")"
            tag_type="$(jq -r '.object.type' <<<"$tag_json")"
            tag_object="$(jq -r '.object.sha' <<<"$tag_json")"
            if [ "$tag_type" = tag ]; then tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$tag_object" --jq '.object.sha')"; else tag_sha="$tag_object"; fi
            test "$tag_sha" = "$COMMIT" || { echo "published tag ref does not resolve to input commit" >&2; exit 1; }
            tag_commit="$tag_sha"
          fi
          RELEASE_JSON=tmp/draft.json TAG="$TAG" COMMIT="$COMMIT" RELEASE_ID="$release_id" PRERELEASE="$PRERELEASE" TAG_COMMIT="$tag_commit" PYTHONPATH=src python - "${expected[@]}" <<'PY'
          import json, os, sys
          from aiworkstation_osi.release_promotion import validate_preflight_release
          validate_preflight_release(
              json.load(open(os.environ['RELEASE_JSON'])), tag=os.environ['TAG'], commit=os.environ['COMMIT'],
              expected_assets=sys.argv[1:], release_id=int(os.environ['RELEASE_ID']),
              prerelease=os.environ['PRERELEASE']=='true', tag_commit=os.environ['TAG_COMMIT'] or None,
          )
          PY

  pypi-validate:
    name: Validate Draft Release artifacts for PyPI
    needs: build-and-stage-draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      wheel_sha: ${{ steps.check.outputs.wheel_sha }}
      sdist_sha: ${{ steps.check.outputs.sdist_sha }}
      version: ${{ needs.build-and-stage-draft.outputs.version }}
      wheel_name: ${{ needs.build-and-stage-draft.outputs.wheel_name }}
      sdist_name: ${{ needs.build-and-stage-draft.outputs.sdist_name }}
      release_id: ${{ needs.build-and-stage-draft.outputs.release_id }}
      release_state: ${{ needs.build-and-stage-draft.outputs.release_state }}
      archive_name: ${{ needs.build-and-stage-draft.outputs.archive_name }}
      asset_ids: ${{ needs.build-and-stage-draft.outputs.asset_ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download exact Draft Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          RELEASE_ID: ${{ needs.build-and-stage-draft.outputs.release_id }}
          ARCHIVE_NAME: ${{ needs.build-and-stage-draft.outputs.archive_name }}
          WHEEL_NAME: ${{ needs.build-and-stage-draft.outputs.wheel_name }}
          SDIST_NAME: ${{ needs.build-and-stage-draft.outputs.sdist_name }}
        run: |
          set -euo pipefail
          mkdir -p tmp/release-assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" > tmp/release.json
          PYTHONPATH=src python - "$RELEASE_ID" "$ARCHIVE_NAME" "$WHEEL_NAME" "$SDIST_NAME" <<'PY' > tmp/release-assets.tsv
          import json, os, sys
          from aiworkstation_osi.release_promotion import validate_release
          release=json.load(open('tmp/release.json'))
          archive_name, wheel_name, sdist_name = sys.argv[2:]
          identity=validate_release(release, tag=os.environ['TAG'], commit=os.environ['COMMIT'], expected_assets=[archive_name, 'SHA256SUMS', 'bundle-report.json', wheel_name, sdist_name, 'PYTHON-DISTS-SHA256SUMS'], release_id=int(os.environ['RELEASE_ID']))
          assets=identity.asset_ids
          for name in [wheel_name, sdist_name, 'PYTHON-DISTS-SHA256SUMS']:
              print(f"{name}\t{assets[name]}")
          PY
          while IFS=$'\t' read -r name asset_id; do
            gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id" > "tmp/release-assets/$name"
          done < tmp/release-assets.tsv
          test "$(find tmp/release-assets -maxdepth 1 -type f -name "$WHEEL_NAME" | wc -l)" -eq 1
          test "$(find tmp/release-assets -maxdepth 1 -type f -name "$SDIST_NAME" | wc -l)" -eq 1
          test "$(find tmp/release-assets -maxdepth 1 -type f -name PYTHON-DISTS-SHA256SUMS | wc -l)" -eq 1
      - name: Verify checksums, metadata, and clean wheel install
        id: check
        env:
          VERSION: ${{ needs.build-and-stage-draft.outputs.version }}
          WHEEL_NAME: ${{ needs.build-and-stage-draft.outputs.wheel_name }}
          SDIST_NAME: ${{ needs.build-and-stage-draft.outputs.sdist_name }}
        run: |
          set -euo pipefail
          PYTHONPATH=src VERSION="$VERSION" WHEEL_NAME="$WHEEL_NAME" SDIST_NAME="$SDIST_NAME" python - <<'PY'
          import os
          from pathlib import Path
          from aiworkstation_osi.release_promotion import validate_sdist_metadata, validate_wheel_metadata, verify_checksum_manifest
          root=Path('tmp/release-assets'); wheel=os.environ['WHEEL_NAME']; sdist=os.environ['SDIST_NAME']
          verify_checksum_manifest((root/'PYTHON-DISTS-SHA256SUMS').read_text(), [wheel, sdist], {wheel: (root/wheel).read_bytes(), sdist: (root/sdist).read_bytes()})
          validate_wheel_metadata((root/wheel).read_bytes(), 'aiworkstation-open-source-intelligence', os.environ['VERSION'])
          validate_sdist_metadata((root/sdist).read_bytes(), 'aiworkstation-open-source-intelligence', os.environ['VERSION'])
          PY
          (cd tmp/release-assets && sha256sum --check PYTHON-DISTS-SHA256SUMS)
          python -m pip install twine
          python -m twine check "tmp/release-assets/$WHEEL_NAME" "tmp/release-assets/$SDIST_NAME"
          venv="$(mktemp -d)"; python -m venv "$venv"; "$venv/bin/pip" install 'mcp>=2,<3' "tmp/release-assets/$WHEEL_NAME"
          env -u PYTHONPATH -u PYTHONHOME VERSION="$VERSION" "$venv/bin/python" - <<'PY'
          import asyncio, importlib.metadata, os, sys
          from pathlib import Path
          from mcp import Client
          import aiworkstation_osi
          from aiworkstation_osi.contracts import TOOL_NAMES
          from aiworkstation_osi.mcp_server import build_mcp_server
          assert importlib.metadata.version('aiworkstation-open-source-intelligence') == os.environ['VERSION']
          assert aiworkstation_osi.__version__ == os.environ['VERSION']
          assert Path(aiworkstation_osi.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          async def check() -> None:
              async with Client(build_mcp_server()) as client:
                  tools = (await client.list_tools()).tools
                  assert {tool.name for tool in tools} == set(TOOL_NAMES)
                  assert len(tools) == 9 and all(tool.annotations and tool.annotations.read_only_hint is True and tool.annotations.destructive_hint is False for tool in tools)
          asyncio.run(check())
          PY
          echo "wheel_sha=$(sha256sum "tmp/release-assets/$WHEEL_NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sdist_sha=$(sha256sum "tmp/release-assets/$SDIST_NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-validated-assets
          overwrite: true
          path: tmp/release-assets/*
          if-no-files-found: error
          retention-days: 14

  pypi-publish-and-verify:
    name: Publish and verify exact PyPI files
    needs: [build-and-stage-draft, pypi-validate]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    outputs:
      wheel_sha: ${{ steps.verify.outputs.wheel_sha }}
      sdist_sha: ${{ steps.verify.outputs.sdist_sha }}
      wheel_name: ${{ needs.pypi-validate.outputs.wheel_name }}
      sdist_name: ${{ needs.pypi-validate.outputs.sdist_name }}
      release_state: ${{ steps.before-upload.outputs.release_state }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: pypi-validated-assets
          path: dist
      - name: Revalidate Release state after environment approval
        id: release-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.build-and-stage-draft.outputs.release_id }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          PRERELEASE: ${{ inputs.prerelease }}
          INITIAL_STATE: ${{ needs.build-and-stage-draft.outputs.release_state }}
          INITIAL_ASSET_IDS: ${{ needs.build-and-stage-draft.outputs.asset_ids }}
          ARCHIVE_NAME: ${{ needs.build-and-stage-draft.outputs.archive_name }}
          WHEEL_NAME: ${{ needs.pypi-validate.outputs.wheel_name }}
          SDIST_NAME: ${{ needs.pypi-validate.outputs.sdist_name }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" > /tmp/release-current.json
          PYTHONPATH=src python - <<'PY'
          import json, os
          from aiworkstation_osi.release_promotion import merge_release_states, validate_asset_ids, validate_release
          expected=[os.environ['ARCHIVE_NAME'], 'SHA256SUMS', 'bundle-report.json', os.environ['WHEEL_NAME'], os.environ['SDIST_NAME'], 'PYTHON-DISTS-SHA256SUMS']
          identity=validate_release(json.load(open('/tmp/release-current.json')), tag=os.environ['TAG'], commit=os.environ['COMMIT'], expected_assets=expected, release_id=int(os.environ['RELEASE_ID']))
          validate_asset_ids(json.load(open('/tmp/release-current.json')), expected_assets=expected, expected_asset_ids={k: int(v) for k, v in json.loads(os.environ['INITIAL_ASSET_IDS']).items()})
          if not identity.draft and identity.prerelease is not (os.environ['PRERELEASE'] == 'true'):
              raise SystemExit('public Release prerelease state does not match input')
          state=merge_release_states([os.environ['INITIAL_STATE'], 'draft' if identity.draft else 'public'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"release_state={'draft' if state == 'draft' else 'public'}\n")
          PY
      - name: Plan safe partial upload from PyPI state
        id: plan
        env:
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ needs.pypi-validate.outputs.version }}
          WHEEL_NAME: ${{ needs.pypi-validate.outputs.wheel_name }}
          SDIST_NAME: ${{ needs.pypi-validate.outputs.sdist_name }}
          RELEASE_STATE: ${{ steps.release-state.outputs.release_state }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          mkdir -p dist/upload
          PYTHONPATH=src python - <<'PY'
          import json, os, shutil, urllib.error, urllib.request
          from pathlib import Path
          from aiworkstation_osi.release_promotion import decide_pypi_promotion, verify_checksum_manifest
          version=os.environ['VERSION']; expected=[os.environ['WHEEL_NAME'], os.environ['SDIST_NAME']]
          root=Path('dist'); files={name: (root/name).read_bytes() for name in (*expected, 'PYTHON-DISTS-SHA256SUMS') if (root/name).is_file()}
          if set(files) != set(expected) | {'PYTHON-DISTS-SHA256SUMS'}:
              raise SystemExit('validated artifact directory is incomplete')
          manifest=(root/'PYTHON-DISTS-SHA256SUMS').read_text()
          hashes=verify_checksum_manifest(manifest, expected, {name: files[name] for name in expected})
          try:
              with urllib.request.urlopen(f'https://pypi.org/pypi/aiworkstation-open-source-intelligence/{version}/json', timeout=15) as response:
                  files=json.load(response)['urls']
          except urllib.error.HTTPError as exc:
              if exc.code != 404: raise
              files=[]
          actual={item['filename']: item['digests']['sha256'] for item in files}
          if any(name not in expected for name in actual): raise SystemExit('PyPI contains unexpected files for this version')
          missing=[]
          for name in expected:
              if name in actual:
                  if actual[name] != hashes[name]: raise SystemExit(f'PyPI hash mismatch: {name}')
              else:
                  missing.append(name)
          action=decide_pypi_promotion(os.environ['RELEASE_STATE'], expected_hashes=hashes, actual_hashes=actual)
          if action == 'upload_missing':
              for name in expected:
                  if name not in actual:
                      shutil.copy2(root/name, Path('dist/upload')/name)
          # Public Releases are verify-only: missing PyPI files fail closed and are never uploaded.
          # Error contract: public Release is missing PyPI files.
          Path('dist/upload-needed').write_text('true' if action == 'upload_missing' else 'false')
          PY
          echo "upload_needed=$(cat dist/upload-needed)" >> "$GITHUB_OUTPUT"
      - name: Revalidate Draft immediately before any PyPI write
        id: before-upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.build-and-stage-draft.outputs.release_id }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          PRERELEASE: ${{ inputs.prerelease }}
          ARCHIVE_NAME: ${{ needs.build-and-stage-draft.outputs.archive_name }}
          WHEEL_NAME: ${{ needs.pypi-validate.outputs.wheel_name }}
          SDIST_NAME: ${{ needs.pypi-validate.outputs.sdist_name }}
          INITIAL_STATE: ${{ needs.build-and-stage-draft.outputs.release_state }}
          INITIAL_ASSET_IDS: ${{ needs.build-and-stage-draft.outputs.asset_ids }}
          APPROVED_STATE: ${{ steps.release-state.outputs.release_state }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" > /tmp/release-before-upload.json
          PYTHONPATH=src python - <<'PY'
          import json, os
          from aiworkstation_osi.release_promotion import merge_release_states, validate_asset_ids, validate_release
          expected=[os.environ['ARCHIVE_NAME'], 'SHA256SUMS', 'bundle-report.json', os.environ['WHEEL_NAME'], os.environ['SDIST_NAME'], 'PYTHON-DISTS-SHA256SUMS']
          identity=validate_release(json.load(open('/tmp/release-before-upload.json')), tag=os.environ['TAG'], commit=os.environ['COMMIT'], expected_assets=expected, release_id=int(os.environ['RELEASE_ID']))
          validate_asset_ids(json.load(open('/tmp/release-before-upload.json')), expected_assets=expected, expected_asset_ids={k: int(v) for k, v in json.loads(os.environ['INITIAL_ASSET_IDS']).items()})
          if not identity.draft and identity.prerelease is not (os.environ['PRERELEASE'] == 'true'):
              raise SystemExit('public Release prerelease state does not match input')
          state=merge_release_states([os.environ['INITIAL_STATE'], os.environ['APPROVED_STATE'], 'draft' if identity.draft else 'public'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"allow_upload={'true' if state == 'draft' else 'false'}\n")
              output.write(f"release_state={state}\n")
          PY
      - name: Publish missing files with PyPI Trusted Publishing
        if: steps.plan.outputs.upload_needed == 'true' && steps.before-upload.outputs.allow_upload == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/upload
      - name: Verify PyPI publication and exact hashes
        id: verify
        env:
          VERSION: ${{ needs.pypi-validate.outputs.version }}
          WHEEL_NAME: ${{ needs.pypi-validate.outputs.wheel_name }}
          SDIST_NAME: ${{ needs.pypi-validate.outputs.sdist_name }}
          EXPECTED_WHEEL_SHA: ${{ needs.pypi-validate.outputs.wheel_sha }}
          EXPECTED_SDIST_SHA: ${{ needs.pypi-validate.outputs.sdist_sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path
          from aiworkstation_osi.release_promotion import verify_checksum_manifest
          version=os.environ['VERSION']; expected={
              os.environ['WHEEL_NAME']: os.environ['EXPECTED_WHEEL_SHA'],
              os.environ['SDIST_NAME']: os.environ['EXPECTED_SDIST_SHA'],
          }
          root=Path('dist')
          files={name: (root/name).read_bytes() for name in (*expected, 'PYTHON-DISTS-SHA256SUMS') if (root/name).is_file()}
          if set(files) != set(expected) | {'PYTHON-DISTS-SHA256SUMS'}:
              raise SystemExit('validated artifact directory is incomplete')
          verify_checksum_manifest((root/'PYTHON-DISTS-SHA256SUMS').read_text(), list(expected), {name: files[name] for name in expected})
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(f'https://pypi.org/pypi/aiworkstation-open-source-intelligence/{version}/json', timeout=15) as response: files=json.load(response)['urls']
                  actual={item['filename']: item['digests']['sha256'] for item in files}
                  if set(actual) == set(expected) and all(actual[n] == h for n,h in expected.items()): break
              except (urllib.error.HTTPError, urllib.error.URLError): pass
              time.sleep(5)
          else: raise SystemExit('PyPI verification did not converge')
          print(json.dumps(actual, sort_keys=True))
          PY
          echo "wheel_sha=$EXPECTED_WHEEL_SHA" >> "$GITHUB_OUTPUT"
          echo "sdist_sha=$EXPECTED_SDIST_SHA" >> "$GITHUB_OUTPUT"

  ghcr-publish-and-verify:
    name: Publish and verify exact GHCR image
    needs: build-and-stage-draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
      release_state: ${{ steps.image.outputs.release_state }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}
      - name: Verify release identity
        id: release-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.build-and-stage-draft.outputs.release_id }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          PRERELEASE: ${{ inputs.prerelease }}
          ARCHIVE_NAME: ${{ needs.build-and-stage-draft.outputs.archive_name }}
          WHEEL_NAME: ${{ needs.build-and-stage-draft.outputs.wheel_name }}
          SDIST_NAME: ${{ needs.build-and-stage-draft.outputs.sdist_name }}
          INITIAL_STATE: ${{ needs.build-and-stage-draft.outputs.release_state }}
          INITIAL_ASSET_IDS: ${{ needs.build-and-stage-draft.outputs.asset_ids }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID")"
          RELEASE_JSON="$release_json" TAG="$TAG" COMMIT="$COMMIT" RELEASE_ID="$RELEASE_ID" PRERELEASE="$PRERELEASE" INITIAL_STATE="$INITIAL_STATE" INITIAL_ASSET_IDS="$INITIAL_ASSET_IDS" ARCHIVE_NAME="$ARCHIVE_NAME" WHEEL_NAME="$WHEEL_NAME" SDIST_NAME="$SDIST_NAME" PYTHONPATH=src python - <<'PY'
          import json, os
          from aiworkstation_osi.release_promotion import merge_release_states, validate_asset_ids, validate_release
          payload=json.loads(os.environ['RELEASE_JSON'])
          expected=[os.environ['ARCHIVE_NAME'], 'SHA256SUMS', 'bundle-report.json', os.environ['WHEEL_NAME'], os.environ['SDIST_NAME'], 'PYTHON-DISTS-SHA256SUMS']
          identity=validate_release(payload, tag=os.environ['TAG'], commit=os.environ['COMMIT'], expected_assets=expected, release_id=int(os.environ['RELEASE_ID']))
          validate_asset_ids(payload, expected_assets=expected, expected_asset_ids={k: int(v) for k, v in json.loads(os.environ['INITIAL_ASSET_IDS']).items()})
          if not identity.draft and identity.prerelease is not (os.environ['PRERELEASE'] == 'true'):
              raise SystemExit('public Release prerelease state does not match input')
          state=merge_release_states([os.environ['INITIAL_STATE'], 'draft' if identity.draft else 'public'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"release_state={state}\n")
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build existing or push new commit-addressed image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ inputs.commit }}
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.build-and-stage-draft.outputs.release_id }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          ARCHIVE_NAME: ${{ needs.build-and-stage-draft.outputs.archive_name }}
          WHEEL_NAME: ${{ needs.build-and-stage-draft.outputs.wheel_name }}
          SDIST_NAME: ${{ needs.build-and-stage-draft.outputs.sdist_name }}
          INITIAL_STATE: ${{ needs.build-and-stage-draft.outputs.release_state }}
          JOB_START_STATE: ${{ steps.release-state.outputs.release_state }}
          INITIAL_ASSET_IDS: ${{ needs.build-and-stage-draft.outputs.asset_ids }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" > /tmp/release-before-image-write.json
          RELEASE_JSON=/tmp/release-before-image-write.json TAG="$TAG" COMMIT="$COMMIT" RELEASE_ID="$RELEASE_ID" PRERELEASE="$PRERELEASE" INITIAL_STATE="$INITIAL_STATE" JOB_START_STATE="$JOB_START_STATE" INITIAL_ASSET_IDS="$INITIAL_ASSET_IDS" ARCHIVE_NAME="$ARCHIVE_NAME" WHEEL_NAME="$WHEEL_NAME" SDIST_NAME="$SDIST_NAME" PYTHONPATH=src python - <<'PY' > /tmp/current-release-state
          import json, os
          from aiworkstation_osi.release_promotion import merge_release_states, validate_asset_ids, validate_release
          expected=[os.environ['ARCHIVE_NAME'], 'SHA256SUMS', 'bundle-report.json', os.environ['WHEEL_NAME'], os.environ['SDIST_NAME'], 'PYTHON-DISTS-SHA256SUMS']
          payload=json.load(open(os.environ['RELEASE_JSON']))
          identity=validate_release(payload, tag=os.environ['TAG'], commit=os.environ['COMMIT'], expected_assets=expected, release_id=int(os.environ['RELEASE_ID']))
          validate_asset_ids(payload, expected_assets=expected, expected_asset_ids={k: int(v) for k, v in json.loads(os.environ['INITIAL_ASSET_IDS']).items()})
          if not identity.draft and identity.prerelease is not (os.environ['PRERELEASE'] == 'true'):
              raise SystemExit('public Release prerelease state does not match input')
          print(merge_release_states([os.environ['INITIAL_STATE'], os.environ['JOB_START_STATE'], 'draft' if identity.draft else 'public']))
          PY
          release_state="$(cat /tmp/current-release-state)"
          if docker pull "$IMAGE" >/dev/null 2>/tmp/image-pull-error; then
            docker image inspect "$IMAGE" > /tmp/existing-image.json
            COMMIT="$COMMIT" IMAGE="$IMAGE" RELEASE_STATE="$release_state" PYTHONPATH=src python - <<'PY'
          import json, os
          from aiworkstation_osi.release_promotion import decide_ghcr_promotion, validate_repo_digest
          data=json.load(open('/tmp/existing-image.json'))[0]
          labels=data.get('Config',{}).get('Labels') or {}
          env=dict(item.split('=',1) for item in data.get('Config',{}).get('Env') or [] if '=' in item)
          repository=os.environ['IMAGE'].rsplit(':',1)[0]
          digest=next((item for item in data.get('RepoDigests',[]) if item.startswith(repository+'@')), None)
          validate_repo_digest(digest or '', repository)
          decide_ghcr_promotion(os.environ['RELEASE_STATE'], image_exists=True, commit=os.environ['COMMIT'], revision=labels.get('org.opencontainers.image.revision'), image_commit=env.get('OSI_IMAGE_COMMIT'), repo_digest=digest, repository=repository)
          PY
          else
            # A public Release missing its image is a hard failure; never build or push it.
            grep -Eiq 'manifest unknown|not found|does not exist' /tmp/image-pull-error || { cat /tmp/image-pull-error >&2; echo "cannot prove that the commit-addressed image tag is absent" >&2; exit 1; }
            gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" > /tmp/release-before-image-push.json
            RELEASE_JSON=/tmp/release-before-image-push.json TAG="$TAG" COMMIT="$COMMIT" RELEASE_ID="$RELEASE_ID" PRERELEASE="$PRERELEASE" INITIAL_STATE="$INITIAL_STATE" JOB_START_STATE="$JOB_START_STATE" PRIOR_STATE="$release_state" INITIAL_ASSET_IDS="$INITIAL_ASSET_IDS" ARCHIVE_NAME="$ARCHIVE_NAME" WHEEL_NAME="$WHEEL_NAME" SDIST_NAME="$SDIST_NAME" PYTHONPATH=src python - <<'PY' > /tmp/prebuild-release-state
          import json, os
          from aiworkstation_osi.release_promotion import decide_ghcr_promotion, merge_release_states, validate_asset_ids, validate_release
          expected=[os.environ['ARCHIVE_NAME'], 'SHA256SUMS', 'bundle-report.json', os.environ['WHEEL_NAME'], os.environ['SDIST_NAME'], 'PYTHON-DISTS-SHA256SUMS']
          payload=json.load(open(os.environ['RELEASE_JSON']))
          identity=validate_release(payload, tag=os.environ['TAG'], commit=os.environ['COMMIT'], expected_assets=expected, release_id=int(os.environ['RELEASE_ID']))
          validate_asset_ids(payload, expected_assets=expected, expected_asset_ids={k: int(v) for k, v in json.loads(os.environ['INITIAL_ASSET_IDS']).items()})
          current='draft' if identity.draft else 'public'
          state=merge_release_states([os.environ['INITIAL_STATE'], os.environ['JOB_START_STATE'], os.environ['PRIOR_STATE'], current])
          # A public observation is verify-only; a missing image must fail before local build.
          decide_ghcr_promotion(state, image_exists=False, commit=os.environ['COMMIT'])
          print(state)
          PY
            release_state="$(cat /tmp/prebuild-release-state)"
            docker buildx build --load --tag "$IMAGE" --label "org.opencontainers.image.revision=$COMMIT" --build-arg "OSI_IMAGE_COMMIT=$COMMIT" .
            gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" > /tmp/release-after-image-build.json
            RELEASE_JSON=/tmp/release-after-image-build.json TAG="$TAG" COMMIT="$COMMIT" RELEASE_ID="$RELEASE_ID" PRERELEASE="$PRERELEASE" INITIAL_STATE="$INITIAL_STATE" START_STATE="$release_state" INITIAL_ASSET_IDS="$INITIAL_ASSET_IDS" ARCHIVE_NAME="$ARCHIVE_NAME" WHEEL_NAME="$WHEEL_NAME" SDIST_NAME="$SDIST_NAME" PYTHONPATH=src python - <<'PY' > /tmp/release-after-build-state
          import json, os
          from aiworkstation_osi.release_promotion import merge_release_states, validate_asset_ids, validate_release
          expected=[os.environ['ARCHIVE_NAME'], 'SHA256SUMS', 'bundle-report.json', os.environ['WHEEL_NAME'], os.environ['SDIST_NAME'], 'PYTHON-DISTS-SHA256SUMS']
          payload=json.load(open(os.environ['RELEASE_JSON']))
          identity=validate_release(payload, tag=os.environ['TAG'], commit=os.environ['COMMIT'], expected_assets=expected, release_id=int(os.environ['RELEASE_ID']))
          validate_asset_ids(payload, expected_assets=expected, expected_asset_ids={k: int(v) for k, v in json.loads(os.environ['INITIAL_ASSET_IDS']).items()})
          current='draft' if identity.draft else 'public'
          print(merge_release_states([os.environ['INITIAL_STATE'], os.environ['START_STATE'], current]))
          PY
            release_state="$(cat /tmp/release-after-build-state)"
            if docker pull "$IMAGE" >/dev/null 2>/tmp/image-pull-after-build-error; then
              docker image inspect "$IMAGE" > /tmp/image-after-build.json
              COMMIT="$COMMIT" IMAGE="$IMAGE" RELEASE_STATE="$release_state" PYTHONPATH=src python - <<'PY'
          import json, os
          from aiworkstation_osi.release_promotion import decide_ghcr_promotion, validate_repo_digest
          data=json.load(open('/tmp/image-after-build.json'))[0]
          labels=data.get('Config',{}).get('Labels') or {}
          env=dict(item.split('=',1) for item in data.get('Config',{}).get('Env') or [] if '=' in item)
          repository=os.environ['IMAGE'].rsplit(':',1)[0]
          digest=next((item for item in data.get('RepoDigests',[]) if item.startswith(repository+'@')), None)
          validate_repo_digest(digest or '', repository)
          decide_ghcr_promotion(os.environ['RELEASE_STATE'], image_exists=True, commit=os.environ['COMMIT'], revision=labels.get('org.opencontainers.image.revision'), image_commit=env.get('OSI_IMAGE_COMMIT'), repo_digest=digest, repository=repository)
          PY
            else
              grep -Eiq 'manifest unknown|not found|does not exist' /tmp/image-pull-after-build-error || { cat /tmp/image-pull-after-build-error >&2; exit 1; }
              RELEASE_STATE="$release_state" COMMIT="$COMMIT" PYTHONPATH=src python - <<'PY'
          import os
          from aiworkstation_osi.release_promotion import decide_ghcr_promotion
          decide_ghcr_promotion(os.environ['RELEASE_STATE'], image_exists=False, commit=os.environ['COMMIT'])
          PY
              docker push "$IMAGE"
            fi
          fi
          echo "release_state=$release_state" >> "$GITHUB_OUTPUT"
      - name: Inspect pushed image identity and digest
        id: verify
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ inputs.commit }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE" >/dev/null
          docker image inspect "$IMAGE" > /tmp/image-inspect.json
          PYTHONPATH=src python - <<'PY'
          import json, os
          from aiworkstation_osi.release_promotion import validate_image_identity
          data=json.load(open('/tmp/image-inspect.json'))
          repository=os.environ['IMAGE'].rsplit(':',1)[0]
          repo_digest=validate_image_identity(data, commit=os.environ['COMMIT'], repository=repository)
          print(f'digest={repo_digest}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write(f'digest={repo_digest}\n')
          PY

  promotion-complete-and-publish-release:
    name: Verify promotion and publish Release
    needs: [build-and-stage-draft, pypi-publish-and-verify, ghcr-publish-and-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow CLI dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y jq

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_ID: ${{ needs.build-and-stage-draft.outputs.release_id }}
          VERSION: ${{ needs.build-and-stage-draft.outputs.version }}
          WHEEL_NAME: ${{ needs.pypi-publish-and-verify.outputs.wheel_name }}
          SDIST_NAME: ${{ needs.pypi-publish-and-verify.outputs.sdist_name }}
          ARCHIVE_NAME: ${{ needs.build-and-stage-draft.outputs.archive_name }}
          INITIAL_STATE: ${{ needs.build-and-stage-draft.outputs.release_state }}
          PYPI_STATE: ${{ needs.pypi-publish-and-verify.outputs.release_state }}
          GHCR_STATE: ${{ needs.ghcr-publish-and-verify.outputs.release_state }}
          INITIAL_ASSET_IDS: ${{ needs.build-and-stage-draft.outputs.asset_ids }}
        run: |
          set -euo pipefail
          expected=("${{ needs.build-and-stage-draft.outputs.archive_name }}" SHA256SUMS bundle-report.json "$WHEEL_NAME" "$SDIST_NAME" PYTHON-DISTS-SHA256SUMS)
          gh api "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID" > /tmp/final-release-before.json
          [[ "$PRERELEASE" == true || "$PRERELEASE" == false ]] || { echo "prerelease input is invalid" >&2; exit 1; }
          test -n "${{ needs.pypi-publish-and-verify.outputs.wheel_sha }}" && test -n "${{ needs.pypi-publish-and-verify.outputs.sdist_sha }}"
          test -n "${{ needs.ghcr-publish-and-verify.outputs.digest }}"
          INITIAL_ASSET_IDS="$INITIAL_ASSET_IDS" RELEASE_JSON=/tmp/final-release-before.json TAG="$TAG" COMMIT="$COMMIT" RELEASE_ID="$RELEASE_ID" PYTHONPATH=src python - "${expected[@]}" <<'PY'
          import json, os, sys
          from aiworkstation_osi.release_promotion import validate_asset_ids, validate_release
          payload=json.load(open(os.environ['RELEASE_JSON']))
          validate_release(payload, tag=os.environ['TAG'], commit=os.environ['COMMIT'], expected_assets=sys.argv[1:], release_id=int(os.environ['RELEASE_ID']))
          validate_asset_ids(payload, expected_assets=sys.argv[1:], expected_asset_ids={k: int(v) for k, v in json.loads(os.environ['INITIAL_ASSET_IDS']).items()})
          PY
          rm -rf /tmp/final-release-assets && mkdir -p /tmp/final-release-assets
          jq -r '.assets[] | [.name, .id] | @tsv' /tmp/final-release-before.json | while IFS=$'\t' read -r name asset_id; do
            gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id" > "/tmp/final-release-assets/$name"
          done
          PYTHONPATH=src ARCHIVE_NAME="${expected[0]}" VERSION="$VERSION" WHEEL_NAME="$WHEEL_NAME" SDIST_NAME="$SDIST_NAME" python - <<'PY'
          import os
          from pathlib import Path
          from aiworkstation_osi.release_promotion import validate_bundle_report, validate_sdist_metadata, validate_wheel_metadata, verify_checksum_manifest
          root=Path('/tmp/final-release-assets'); archive=os.environ['ARCHIVE_NAME']; wheel=os.environ['WHEEL_NAME']; sdist=os.environ['SDIST_NAME']
          verify_checksum_manifest((root/'SHA256SUMS').read_text(), [archive], {archive: (root/archive).read_bytes()})
          verify_checksum_manifest((root/'PYTHON-DISTS-SHA256SUMS').read_text(), [wheel, sdist], {wheel: (root/wheel).read_bytes(), sdist: (root/sdist).read_bytes()})
          validate_bundle_report((root/'bundle-report.json').read_bytes(), expected_name='aiworkstation-open-source-intelligence', expected_version=os.environ['VERSION'], expected_archive_name=archive, archive_bytes=(root/archive).read_bytes())
          validate_wheel_metadata((root/wheel).read_bytes(), 'aiworkstation-open-source-intelligence', os.environ['VERSION'])
          validate_sdist_metadata((root/sdist).read_bytes(), 'aiworkstation-open-source-intelligence', os.environ['VERSION'])
          PY
          (cd /tmp/final-release-assets && sha256sum --check SHA256SUMS && sha256sum --check PYTHON-DISTS-SHA256SUMS)
          test "$(sha256sum "/tmp/final-release-assets/$WHEEL_NAME" | cut -d' ' -f1)" = "${{ needs.pypi-publish-and-verify.outputs.wheel_sha }}"
          test "$(sha256sum "/tmp/final-release-assets/$SDIST_NAME" | cut -d' ' -f1)" = "${{ needs.pypi-publish-and-verify.outputs.sdist_sha }}"
          VERSION="$VERSION" WHEEL_NAME="$WHEEL_NAME" SDIST_NAME="$SDIST_NAME" EXPECTED_WHEEL_SHA="${{ needs.pypi-publish-and-verify.outputs.wheel_sha }}" EXPECTED_SDIST_SHA="${{ needs.pypi-publish-and-verify.outputs.sdist_sha }}" python - <<'PY'
          import json, os, urllib.request
          version=os.environ['VERSION']
