name: github-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.3.0
        required: true
        type: string
      commit:
        description: Full commit SHA to release
        required: true
        type: string
      prerelease:
        description: Mark this release as a pre-release
        required: true
        default: true
        type: boolean

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  build-and-create:
    name: Build and create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate release identity and package version
        id: version
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "commit must be a full 40-character SHA" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$COMMIT^{commit}")" || { echo "checkout did not resolve to requested commit" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v0.3.0" >&2; exit 1; }
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then echo "tag already exists" >&2; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release already exists" >&2; exit 1; fi
          version="$(PYTHONPATH=src python - <<'PY'
          import aiworkstation_osi
          print(aiworkstation_osi.__version__)
          PY
          )"
          plugin_version="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('.codex-plugin/plugin.json').read_text(encoding='utf-8'))['version'])
          PY
          )"
          test "$TAG" = "v$version" || { echo "tag does not match runtime version" >&2; exit 1; }
          test "$version" = "$plugin_version" || { echo "runtime does not match plugin version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install and run release gates
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build twine -e ".[mcp]"
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
          osi-validate-plugin --root .
          ruff check src

      - name: Build deterministic Skills bundle
        run: |
          set -euo pipefail
          rm -rf dist
          osi-build-alpha --root . --output-dir dist/alpha
          (cd dist/alpha && sha256sum --check SHA256SUMS)
          osi-build-alpha --root . --output-dir dist/alpha-second
          test "$(sha256sum dist/alpha/*.zip | cut -d' ' -f1)" = "$(sha256sum dist/alpha-second/*.zip | cut -d' ' -f1)"

      - name: Build Python release artifacts
        run: |
          set -euo pipefail
          python -m build --outdir dist/python
          wheels=(dist/python/*.whl); sdists=(dist/python/*.tar.gz)
          test "${#wheels[@]}" -eq 1; test "${#sdists[@]}" -eq 1
          (cd dist/python && sha256sum "$(basename "${wheels[0]}")" "$(basename "${sdists[0]}")" > PYTHON-DISTS-SHA256SUMS)
          python -m twine check "${wheels[0]}" "${sdists[0]}"

      - name: Create GitHub Release with all assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [ "$PRERELEASE" = "true" ]; then prerelease_flag+=(--prerelease); fi
          archive="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('dist/alpha/bundle-report.json').read_text())['archive'])
          PY
          )"
          wheel=(dist/python/*.whl); sdist=(dist/python/*.tar.gz)
          test "${#wheel[@]}" -eq 1; test "${#sdist[@]}" -eq 1
          gh release create "$TAG" --target "$(git rev-parse HEAD)" "${prerelease_flag[@]}" \
            --title "$TAG — AI Open Source Intelligence" --notes-file CHANGELOG.md \
            "$archive" dist/alpha/SHA256SUMS dist/alpha/bundle-report.json \
            "${wheel[0]}" "${sdist[0]}" dist/python/PYTHON-DISTS-SHA256SUMS

      - name: Verify published Release identity and exact asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = false
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/$TAG" --jq '.sha')" = "$COMMIT"
          archive="$(python - <<'PY'
          import json
          from pathlib import Path
          print(Path(json.loads(Path('dist/alpha/bundle-report.json').read_text())['archive']).name)
          PY
          )"
          wheel="$(basename dist/python/*.whl)"; sdist="$(basename dist/python/*.tar.gz)"
          expected=$(printf '%s\n' "$archive" SHA256SUMS bundle-report.json "$wheel" "$sdist" PYTHON-DISTS-SHA256SUMS | sort)
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          test "$expected" = "$actual" || { echo "Release asset set mismatch" >&2; diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true; exit 1; }

      - name: Upload validated Python assets
        uses: actions/upload-artifact@v4
        with:
          name: pypi-release-assets
          path: |
            dist/python/*.whl
            dist/python/*.tar.gz
            dist/python/PYTHON-DISTS-SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  pypi-validate:
    name: Validate Release artifacts for PyPI
    needs: build-and-create
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download exact Release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.build-and-create.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p tmp/release-assets
          names="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --jq '.assets[].name')"
          wheel_name="$(printf '%s\n' "$names" | grep -E '^aiworkstation_open_source_intelligence-'"$VERSION"'-[^/]+\.whl$' || true)"
          sdist_name="aiworkstation_open_source_intelligence-${VERSION}.tar.gz"
          test "$(printf '%s\n' "$wheel_name" | sed '/^$/d' | wc -l)" -eq 1
          printf '%s\n' "$names" | grep -Fxq "$sdist_name"
          printf '%s\n' "$names" | grep -Fxq PYTHON-DISTS-SHA256SUMS
          gh release download "$TAG" --dir tmp/release-assets --pattern "$wheel_name" --pattern "$sdist_name" --pattern PYTHON-DISTS-SHA256SUMS
          test "$(find tmp/release-assets -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find tmp/release-assets -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find tmp/release-assets -maxdepth 1 -name 'PYTHON-DISTS-SHA256SUMS' | wc -l)" -eq 1
      - name: Verify checksums, metadata, and clean wheel install
        env:
          VERSION: ${{ needs.build-and-create.outputs.version }}
        run: |
          set -euo pipefail
          (cd tmp/release-assets && sha256sum --check PYTHON-DISTS-SHA256SUMS)
          python -m pip install twine
          python -m twine check tmp/release-assets/*.whl tmp/release-assets/*.tar.gz
          venv="$(mktemp -d)"; python -m venv "$venv"; wheel_path="$(find tmp/release-assets -maxdepth 1 -name '*.whl' -print -quit)"; "$venv/bin/pip" install 'mcp>=2,<3' "$wheel_path"
          env -u PYTHONPATH VERSION="$VERSION" "$venv/bin/python" - <<'PY'
          import asyncio
          import importlib.metadata
          import os
          from mcp import Client
          import aiworkstation_osi
          from aiworkstation_osi.contracts import TOOL_NAMES
          from aiworkstation_osi.mcp_server import build_mcp_server
          assert importlib.metadata.version('aiworkstation-open-source-intelligence') == os.environ['VERSION']
          assert aiworkstation_osi.__version__ == os.environ['VERSION']
          assert str(aiworkstation_osi.__file__).startswith('/tmp/')
          async def check() -> None:
              async with Client(build_mcp_server()) as client:
                  tools = (await client.list_tools()).tools
                  assert {tool.name for tool in tools} == set(TOOL_NAMES)
                  assert len(tools) == 9
                  assert all(tool.annotations and tool.annotations.read_only_hint for tool in tools)
          asyncio.run(check())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-validated-assets
          path: tmp/release-assets/*
          if-no-files-found: error
          retention-days: 14

  pypi-publish:
    name: Publish exact artifacts to PyPI
    needs: pypi-validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-validated-assets
          path: dist
      - name: Keep checksum out of PyPI upload payload
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name 'PYTHON-DISTS-SHA256SUMS' | wc -l)" -eq 1
          mv dist/PYTHON-DISTS-SHA256SUMS /tmp/PYTHON-DISTS-SHA256SUMS
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  ghcr-publish:
    name: Publish exact commit to GHCR
    needs: build-and-create
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit }}
      - name: Verify commit and Release tag identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/$TAG" --jq '.sha')" = "$COMMIT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push commit-addressed image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/sha-${{ inputs.commit }}
          labels: org.opencontainers.image.revision=${{ inputs.commit }}
          build-args: OSI_IMAGE_COMMIT=${{ inputs.commit }}

  promotion-complete:
    name: Promotion complete
    needs: [pypi-publish, ghcr-publish]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "GitHub Release, PyPI, and GHCR promotion completed successfully."
