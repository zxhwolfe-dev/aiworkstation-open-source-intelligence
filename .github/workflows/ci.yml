name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with MCP runtime
        run: python -m pip install --upgrade pip && python -m pip install -e ".[mcp]"

      - name: Validate JSON artifacts
        run: |
          python -m json.tool .codex-plugin/plugin.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          python -m json.tool schemas/tool-manifest.json >/dev/null
          python -m json.tool schemas/tool-result.schema.json >/dev/null
          python -m json.tool evals/cases.json >/dev/null
          python -m json.tool evals/plugin-cases.json >/dev/null

      - name: Run unit and in-memory MCP tests
        run: python -m unittest discover -s tests -v

      - name: Validate plugin package
        run: osi-validate-plugin --root .

      - name: Smoke test local commands
        run: |
          osi-m0 provider-info >/dev/null
          osi-m0 list-tools >/dev/null
          osi-m0 invoke search_ai_projects --arguments '{"query":"self-hosted RAG"}' >/dev/null
          osi-probe --help >/dev/null
          osi-capture-contracts --help >/dev/null
          osi-validate-contracts --help >/dev/null
          osi-replay-contracts --help >/dev/null
          osi-validate-plugin --help >/dev/null
          python -c 'from aiworkstation_osi.mcp_server import mcp; assert mcp is not None'
