name: live-contract-validation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: Allowed public AI Workstation origin to validate
        required: true
        default: https://aiworkstation.cn
        type: choice
        options:
          - https://aiworkstation.cn
          - https://useaistation.com
      project_id:
        description: Stable public project ID used for detail checks
        required: true
        default: infiniflow/ragflow
        type: string

permissions:
  contents: read

concurrency:
  group: live-contract-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VALIDATION_ROOT: tmp/live-contract-validation
      BASE_URL: ${{ inputs.base_url || 'https://aiworkstation.cn' }}
      PROJECT_ID: ${{ inputs.project_id || 'infiniflow/ragflow' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate workflow inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import urllib.parse

          base_url = os.environ["BASE_URL"].rstrip("/")
          project_id = os.environ["PROJECT_ID"].strip()
          parsed = urllib.parse.urlparse(base_url)
          allowed_hosts = {"aiworkstation.cn", "useaistation.com"}
          if parsed.scheme != "https" or parsed.hostname not in allowed_hosts or parsed.path not in {"", "/"}:
              raise SystemExit("base_url must be an allowed HTTPS AI Workstation origin")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", project_id):
              raise SystemExit("project_id must use owner/repository form")
          PY

      - name: Install validation runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]"

      - name: Run offline quality gates
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          osi-validate-plugin --root .

      - name: Diagnose public evidence path availability
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base_url = os.environ["BASE_URL"].rstrip("/")
          project_id = os.environ["PROJECT_ID"].strip()
          user_agent = "aiworkstation-open-source-intelligence/0.1"

          def request_json(label, path, *, query=None, body=None, timeout=10.0):
              encoded_query = urllib.parse.urlencode(
                  [(key, value) for key, value in (query or {}).items() if value is not None],
                  doseq=True,
              )
              url = base_url + "/" + path.lstrip("/")
              if encoded_query:
                  url += "?" + encoded_query
              data = json.dumps(body, ensure_ascii=False).encode("utf-8") if body is not None else None
              headers = {"accept": "application/json", "user-agent": user_agent}
              if data is not None:
                  headers["content-type"] = "application/json"
              request = urllib.request.Request(
                  url,
                  data=data,
                  method="POST" if body is not None else "GET",
                  headers=headers,
              )
              started = time.monotonic()
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      status = int(response.status)
                      raw = response.read(2_000_001)
                  try:
                      payload = json.loads(raw.decode("utf-8")) if raw else {}
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      payload = {}
                  print(json.dumps({
                      "stage": label,
                      "status": status,
                      "elapsed_ms": int((time.monotonic() - started) * 1000),
                      "json_object": isinstance(payload, dict),
                  }, separators=(",", ":")))
                  return status, payload if isinstance(payload, dict) else {}
              except urllib.error.HTTPError as exc:
                  print(json.dumps({
                      "stage": label,
                      "status": int(exc.code),
                      "elapsed_ms": int((time.monotonic() - started) * 1000),
                      "failure_type": "HTTPError",
                  }, separators=(",", ":")))
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  print(json.dumps({
                      "stage": label,
                      "status": None,
                      "elapsed_ms": int((time.monotonic() - started) * 1000),
                      "failure_type": type(exc).__name__,
                  }, separators=(",", ":")))
              return None, {}

          request_json("overview", "/api/v1/ai/githubai/overview", query={"lang": "en"})
          lookup_status, lookup = request_json(
              "project_lookup",
              "/api/v1/ai/githubai/projects",
              query={"lang": "en", "q": project_id, "limit": 20, "offset": 0},
          )
          route_id = ""
          if lookup_status == 200:
              normalized = project_id.lower()
              for item in lookup.get("items") or []:
                  if not isinstance(item, dict):
                      continue
                  full_name = str(item.get("full_name") or "").strip().lower()
                  owner = str(item.get("owner") or "").strip()
                  repo = str(item.get("repo") or "").strip()
                  owner_repo = f"{owner}/{repo}".lower() if owner and repo else ""
                  item_id = str(item.get("id") or "").strip()
                  aliases = {full_name, owner_repo, item_id.lower()}
                  if normalized in aliases:
                      route_id = item_id or full_name or owner_repo
                      break
          if route_id:
              request_json(
                  "project_detail",
                  "/api/v1/ai/githubai/projects/" + urllib.parse.quote(route_id, safe=""),
                  query={"lang": "en"},
              )
          else:
              print(json.dumps({
                  "stage": "project_detail",
                  "status": None,
                  "elapsed_ms": 0,
                  "failure_type": "lookup_unresolved",
              }, separators=(",", ":")))

          request_json(
              "selector",
              "/api/v1/ai/githubai/selector",
              body={
                  "query": "public release validation",
                  "filters": {},
                  "lang": "en",
                  "use_model": False,
                  "client_id": "aiworkstation-osi-live-validation",
              },
          )
          PY

      - name: Run English and Chinese public probes
        run: |
          set -euo pipefail
          mkdir -p "$VALIDATION_ROOT"
          osi-probe \
            --base-url "$BASE_URL" \
            --locale en \
            --project-id "$PROJECT_ID" \
            --output "$VALIDATION_ROOT/probe-en.json"
          osi-probe \
            --base-url "$BASE_URL" \
            --locale zh \
            --project-id "$PROJECT_ID" \
            --output "$VALIDATION_ROOT/probe-zh.json"

      - name: Capture sanitized public contracts
        run: |
          set -euo pipefail
          osi-capture-contracts \
            --base-url "$BASE_URL" \
            --locale en \
            --project-id "$PROJECT_ID" \
            --output-dir "$VALIDATION_ROOT/contracts-en"
          osi-capture-contracts \
            --base-url "$BASE_URL" \
            --locale zh \
            --project-id "$PROJECT_ID" \
            --output-dir "$VALIDATION_ROOT/contracts-zh"

      - name: Validate and replay captured contracts
        run: |
          set -euo pipefail
          for locale in en zh; do
            directory="$VALIDATION_ROOT/contracts-$locale"
            osi-validate-contracts --directory "$directory"
            osi-replay-contracts \
              --directory "$directory" \
              --output "$VALIDATION_ROOT/replay-$locale.json"
          done

      - name: Scan artifacts for forbidden JSON keys
        run: |
          set -euo pipefail
          forbidden_key_pattern='"(authorization|cookie|cookies|api[_-]?key|apikey|access[_-]?token|refresh[_-]?token|bearer[_-]?token|password|secret|email|client_id|request_id|query|prompt|raw|raw_content|source_hash|evidence_ids|claim_refs|publication_version|validated_version|assignment_version|prompt_version)"[[:space:]]*:'
          if grep -RniE \
            "$forbidden_key_pattern" \
            "$VALIDATION_ROOT/contracts-en" \
            "$VALIDATION_ROOT/contracts-zh"; then
            echo "Forbidden or unsanitized JSON key found in captured artifacts." >&2
            exit 1
          fi

      - name: Write validation summary and evidence manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(os.environ["VALIDATION_ROOT"])
          rows = []
          probe_status = {}
          replay_status = {}
          for locale in ("en", "zh"):
              probe = json.loads((root / f"probe-{locale}.json").read_text(encoding="utf-8"))
              replay = json.loads((root / f"replay-{locale}.json").read_text(encoding="utf-8"))
              probe_status[locale] = probe.get("ok") is True
              replay_status[locale] = replay.get("ok") is True
              rows.append(
                  f"| {locale} | {probe.get('ok')} | {replay.get('ok')} | "
                  f"{len(probe.get('checks') or [])} | {len(probe.get('errors') or [])} |"
              )

          if not all(probe_status.values()) or not all(replay_status.values()):
              raise SystemExit("validation evidence cannot be written from failed probes or replay")

          summary = [
              "# Live Radar contract validation",
              "",
              f"- Base URL: `{os.environ['BASE_URL']}`",
              f"- Project ID: `{os.environ['PROJECT_ID']}`",
              "- Requests: anonymous and read-only",
              "- Captures: sanitized and scanned before artifact upload",
              "",
              "| Locale | Probe passed | Replay passed | Probe checks | Probe errors |",
              "| --- | ---: | ---: | ---: | ---: |",
              *rows,
              "",
              "The workflow uploads an artifact only after probes, contract validation, replay, and forbidden-key scanning all pass.",
          ]
          rendered = "\n".join(summary) + "\n"
          (root / "SUMMARY.md").write_text(rendered, encoding="utf-8")
          github_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if github_summary:
              Path(github_summary).write_text(rendered, encoding="utf-8")

          protected_files = {}
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name == "validation-evidence.json":
                  continue
              relative = path.relative_to(root).as_posix()
              protected_files[relative] = hashlib.sha256(path.read_bytes()).hexdigest()

          evidence = {
              "schema_version": "osi.live-validation-evidence.v1",
              "generated_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "workflow": "live-contract-validation",
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "commit": os.environ.get("GITHUB_SHA", ""),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "base_url": os.environ["BASE_URL"].rstrip("/"),
              "project_id": os.environ["PROJECT_ID"].strip(),
              "contracts": {"en": "contracts-en", "zh": "contracts-zh"},
              "checks": {
                  "probe_en": True,
                  "probe_zh": True,
                  "contract_validate_en": True,
                  "contract_validate_zh": True,
                  "replay_en": True,
                  "replay_zh": True,
                  "forbidden_key_scan": True,
              },
              "files": protected_files,
          }
          (root / "validation-evidence.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload sanitized validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: live-contract-validation-${{ github.run_id }}
          path: ${{ env.VALIDATION_ROOT }}
          if-no-files-found: error
          retention-days: 14
