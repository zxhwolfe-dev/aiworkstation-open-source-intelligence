name: Bug report
description: Report a reproducible product, installation, CLI, Skill, or MCP defect.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. Do not include credentials, private prompts, customer data, private source code, or unsanitized captures. Security-sensitive reports must follow SECURITY.md.
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: v0.3.0 or commit SHA
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: Codex CLI 0.x, ChatGPT, other MCP host
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider / mode
      options:
        - Skills-only
        - mock
        - http
        - local Streamable HTTP
        - hosted/private MCP
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - en
        - zh
        - both
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Safe reproduction steps
      description: Use only sanitized, minimal input.
    validations:
      required: true
  - type: input
    id: error
    attributes:
      label: Relevant error code
      placeholder: INVALID_INPUT / PROVIDER_UNAVAILABLE / ...
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private prompts, private source code, customer data, and confidential material.
          required: true
