# Copy this table into ~/.codex/config.toml or, for a trusted project,
# .codex/config.toml. Replace both absolute path placeholders first.

[mcp_servers.ai_open_source_intelligence]
command = "/ABSOLUTE/PATH/TO/aiworkstation-open-source-intelligence/.venv/bin/osi-mcp"
cwd = "/ABSOLUTE/PATH/TO/aiworkstation-open-source-intelligence"
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 120
default_tools_approval_mode = "prompt"
enabled_tools = [
  "search_ai_projects",
  "get_project_facts",
  "get_license_evidence",
  "compare_ai_projects",
  "find_alternatives",
  "compose_ai_stack",
]

[mcp_servers.ai_open_source_intelligence.env]
OSI_PROVIDER = "http"
AIWORKSTATION_RADAR_BASE_URL = "https://aiworkstation.cn"
OSI_HTTP_TIMEOUT_SECONDS = "30"
OSI_HYDRATE_LIMIT = "5"
