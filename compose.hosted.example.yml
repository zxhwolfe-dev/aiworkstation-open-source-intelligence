services:
  osi-mcp:
    build:
      context: .
    restart: unless-stopped
    environment:
      OSI_PROVIDER: http
      AIWORKSTATION_RADAR_BASE_URL: https://aiworkstation.cn
      OSI_HTTP_TIMEOUT_SECONDS: "30"
      OSI_HYDRATE_LIMIT: "5"
      OSI_MCP_HTTP_HOST: 0.0.0.0
      OSI_MCP_HTTP_PORT: "8000"
      OSI_MCP_HTTP_PUBLIC_BIND_ACK: reverse-proxy-or-private-network
    ports:
      # Deliberately bind only to host loopback. Put an authenticated TLS reverse
      # proxy in front before any Internet exposure.
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
