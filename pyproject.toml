[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aiworkstation-open-source-intelligence"
version = "0.1.0"
description = "Skills and read-only project intelligence tools for open-source AI research and technology selection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - pre-alpha" }
authors = [{ name = "AI Workstation" }]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
osi-m0 = "aiworkstation_osi.cli:main"
osi-mcp = "aiworkstation_osi.mcp_server:main"
osi-probe = "aiworkstation_osi.probe:main"
osi-capture-contracts = "aiworkstation_osi.contract_capture:main"
osi-validate-contracts = "aiworkstation_osi.fixture_validation:main"
osi-replay-contracts = "aiworkstation_osi.fixture_replay:main"
osi-validate-plugin = "aiworkstation_osi.plugin_validation:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
