[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aiworkstation-open-source-intelligence"
version = "0.1.0"
description = "Evidence-backed Skills, CLI, and MCP tools for open-source AI research and technology selection."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AI Workstation" }]
keywords = [
  "ai",
  "open-source",
  "mcp",
  "rag",
  "agents",
  "technology-selection",
  "license-evidence",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://aiworkstation.cn/githubai/"
Repository = "https://github.com/zxhwolfe-dev/aiworkstation-open-source-intelligence"
Documentation = "https://github.com/zxhwolfe-dev/aiworkstation-open-source-intelligence/blob/main/docs/QUICKSTART.md"
Issues = "https://github.com/zxhwolfe-dev/aiworkstation-open-source-intelligence/issues"
Changelog = "https://github.com/zxhwolfe-dev/aiworkstation-open-source-intelligence/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
osi-m0 = "aiworkstation_osi.cli:main"
osi-mcp = "aiworkstation_osi.mcp_server:main"
osi-mcp-http = "aiworkstation_osi.http_server:main"
osi-mcp-hosted = "aiworkstation_osi.hosted_http_server:main"
osi-remote-smoke = "aiworkstation_osi.remote_smoke:main"
osi-probe = "aiworkstation_osi.probe:main"
osi-capture-contracts = "aiworkstation_osi.contract_capture:main"
osi-validate-contracts = "aiworkstation_osi.fixture_validation:main"
osi-replay-contracts = "aiworkstation_osi.fixture_replay:main"
osi-validate-plugin = "aiworkstation_osi.plugin_validation:main"
osi-build-alpha = "aiworkstation_osi.alpha_bundle:main"
osi-readiness = "aiworkstation_osi.release_readiness:main"
osi-codex-acceptance = "aiworkstation_osi.codex_acceptance:main"
osi-evidence-readiness = "aiworkstation_osi.evidence_readiness:main"
osi-hosted-evidence-readiness = "aiworkstation_osi.hosted_evidence_readiness:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
