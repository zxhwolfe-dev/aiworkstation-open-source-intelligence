services:
  osi-mcp-hosted:
    build:
      context: .
      args:
        OSI_IMAGE_COMMIT: ${OSI_RELEASE_COMMIT:?required}
    command: ["osi-mcp-hosted"]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      OSI_PROVIDER: http
      AIWORKSTATION_RADAR_BASE_URL: https://aiworkstation.cn
      OSI_HTTP_TIMEOUT_SECONDS: "30"
      OSI_HYDRATE_LIMIT: "5"

      # Current product invariant: exactly nine anonymous read-only Radar tools.
      # This release has no runtime OAuth, Premium, credits, checkout or
      # AI Workstation server-model execution switch.
      OSI_HOSTED_ACCESS_MODE: public

      # Non-secret exact Git SHA for deployment/evidence binding. The same SHA
      # is baked into the image as OSI_IMAGE_COMMIT at build time. Hosted startup
      # fails unless both identities match.
      OSI_RELEASE_COMMIT: ${OSI_RELEASE_COMMIT:?required}

      OSI_MCP_HTTP_HOST: 0.0.0.0
      OSI_MCP_HTTP_PORT: "8000"
      OSI_MCP_HTTP_PUBLIC_BIND_ACK: reverse-proxy-or-private-network
      OSI_MCP_HTTP_ALLOWED_HOSTS: mcp.aiworkstation.cn,mcp.aiworkstation.cn:*
      OSI_MCP_HTTP_MAX_REQUEST_BODY_BYTES: "262144"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"127.0.0.1\",8000),3); s.close()'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
